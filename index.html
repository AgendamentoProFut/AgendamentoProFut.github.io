<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Gestão de Jogadores</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid #4e6d8c;
        }
        h2 {
            margin-bottom: 25px;
            color: #f1c40f;
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .counter-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            color: #2ecc71;
            border: 1px solid #4b6584;
            font-weight: bold;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #bdc3c7;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #1e272e;
            border: 1px solid #4b6584;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Novo Jogador</h2>
        <div class="counter-info" id="counterInfo">Carregando vagas disponíveis...</div>
        
        <form id="sheetForm">
            <div class="input-group">
                <label for="nome">Nome do Jogador:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Hélio" required>
            </div>
            <div class="input-group">
                <label for="posicao">Posição:</label>
                <input type="text" id="posicao" name="posicao" placeholder="Ex: Meia / Atacante" required>
            </div>
            <button type="submit" id="btnSubmit">Salvar na Planilha</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxnHcaY9-PxfJ0fYAuRzFSSnbpLaGCIBVrBHd7xTKX1yZlJS8hhaxLKvhDFpowf_DC_/exec';
        
        const form = document.getElementById('sheetForm');
        const statusDiv = document.getElementById('status');
        const btnSubmit = document.getElementById('btnSubmit');
        const counterInfo = document.getElementById('counterInfo');

        // Função de callback exigida pelo JSONP
        window.processarVagas = function(data) {
            const vagasPreenchidas = data.total || 0;
            const vagasRestantes = Math.max(0, 10 - vagasPreenchidas);
            
            if (vagasRestantes > 0) {
                counterInfo.textContent = `Vagas disponíveis: ${vagasRestantes} de 10`;
                counterInfo.style.color = '#2ecc71';
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Salvar na Planilha';
            } else {
                counterInfo.textContent = 'Todas as 10 vagas foram preenchidas!';
                counterInfo.style.color = '#e74c3c';
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Vagas Esgotadas';
            }
        };

        function atualizarVagas() {
            // Remove script antigo se houver
            const oldScript = document.getElementById('jsonpScript');
            if (oldScript) oldScript.remove();

            // Cria uma tag script dinâmica para burlar o CORS via JSONP
            const script = document.createElement('script');
            script.id = 'jsonpScript';
            script.src = scriptURL + '?callback=processarVagas';
            script.onerror = function() {
                counterInfo.textContent = 'Vagas disponíveis: 10 de 10';
                counterInfo.style.color = '#2ecc71';
            };
            document.body.appendChild(script);
        }

        // Carrega ao abrir a página
        atualizarVagas();

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Enviando...';
            statusDiv.style.color = '#f39c12';
            statusDiv.textContent = 'Salvando dados na planilha...';

            const requestData = {
                nome: document.getElementById('nome').value,
                posicao: document.getElementById('posicao').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(() => {
                statusDiv.style.color = '#2ecc71';
                statusDiv.textContent = 'Salvo com sucesso!';
                form.reset();
                // Atualiza o contador de vagas após 2 segundos para dar tempo do Google salvar
                setTimeout(atualizarVagas, 2000);
            })
            .catch(error => {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = 'Erro ao enviar. Tente novamente.';
                console.error('Erro!', error.message);
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Salvar na Planilha';
            });
        });
    </script>

</body>
</html>
